[package]
name = "hermes-ui"
description = "Slint UI for Hermes Desktop: views, theme, motion and the bridge from hermes-core events to UI models."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hermes-core.workspace = true
slint.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true

# Already in the dependency tree via slint (no new crates): drive the real UI headlessly
# in tests/live_backend.rs. Pinned to slint's exact version because the IME events use
# i-slint-core's internal key-event type.
[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
i-slint-core = "=1.18.1"

[build-dependencies]
slint-build.workspace = true
