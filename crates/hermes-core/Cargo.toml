[package]
name = "hermes-core"
description = "Hermes gateway protocol client (JSON-RPC over WebSocket) and UI-agnostic state reducers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
# Syntax highlighting (approved 2026-10-16, docs/DEPS-HIGHLIGHT.md): pure-Rust regex backend
# (fancy-regex, no Oniguruma/C), bundled default syntax set only, no bundled themes.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }
