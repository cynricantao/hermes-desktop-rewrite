[workspace]
resolver = "3"
members = ["crates/hermes-core", "crates/hermes-ui", "crates/hermes-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cynricantao/hermes-desktop-rewrite"
rust-version = "1.88"

[workspace.dependencies]
hermes-core = { path = "crates/hermes-core" }
hermes-ui = { path = "crates/hermes-ui" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "accessibility"] }
slint-build = "1.18"
tokio-tungstenite = "0.30"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Release codegen with symbols, for stack sampling (docs/PERF.md).
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
